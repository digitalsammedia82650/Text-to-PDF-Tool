<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Professional Doc Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { margin: 0; background: #e2e8f0; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; }
        
        /* Ribbon stays fixed at the top */
        .ribbon { 
            position: sticky; top: 0; width: 100%; background: #fff; padding: 12px; 
            border-bottom: 1px solid #ccc; display: flex; gap: 8px; justify-content: center; 
            z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
        }
        
        /* The single A4 Page Canvas acting as the editor */
        .page { 
            width: 794px; min-height: 1123px; background: white; margin: 40px 0;
            padding: 96px; box-sizing: border-box; box-shadow: 0 0 10px rgba(0,0,0,0.1); 
            outline: none; /* Allows direct editing */
        }
        
        button { padding: 8px 15px; cursor: pointer; border: 1px solid #ccc; background: #f8f8f8; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

<div class="ribbon">
    <button onclick="document.execCommand('bold')">B</button>
    <button onclick="document.execCommand('italic')">I</button>
    <button onclick="document.execCommand('underline')">U</button>
    <button onclick="document.execCommand('justifyLeft')">Left</button>
    <button onclick="document.execCommand('justifyCenter')">Center</button>
    <button onclick="document.execCommand('justifyFull')">Justify</button>
    <button onclick="document.execCommand('insertUnorderedList')">List</button>
    <button onclick="exportPDF()" style="background:#0f172a; color:#fff;">Export PDF</button>
</div>

<div class="page" id="editor" contenteditable="true">
    <h1>New Document</h1>
    <p>Type or paste your text directly here. No separate editor needed.</p>
</div>

<script>
    const editor = document.getElementById('editor');

    // Auto-save logic
    editor.addEventListener('input', () => {
        localStorage.setItem('doc-data', editor.innerHTML);
    });

    // Load saved data
    window.onload = () => {
        editor.innerHTML = localStorage.getItem('doc-data') || editor.innerHTML;
    };

    // PDF Export logic
    async function exportPDF() {
        const { jsPDF } = window.jspdf;
        const canvas = await html2canvas(editor, { scale: 2 });
        const img = canvas.toDataURL('image/jpeg', 1.0);
        const pdf = new jsPDF('p', 'pt', 'a4');
        pdf.addImage(img, 'JPEG', 0, 0, 595, 842);
        pdf.save("document.pdf");
    }
</script>
</body>
</html>
