<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Professional Document Platform</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { margin:0; background:#e2e8f0; font-family:Arial,sans-serif; }
        
        /* Unified Ribbon */
        .ribbon { background:#fff; padding:12px; border-bottom:1px solid #ccc; display:flex; gap:8px; position:sticky; top:0; z-index:1000; justify-content:center; box-shadow:0 2px 5px rgba(0,0,0,0.05); }
        button { padding:8px 15px; cursor:pointer; border:1px solid #ccc; background:#f8f8f8; border-radius:4px; font-weight:bold; }
        
        /* Workspace acts as the editor */
        .workspace { padding:40px; display:flex; flex-direction:column; align-items:center; gap:40px; }
        .page { 
            width:794px; min-height:1123px; background:white; padding:96px; 
            box-sizing:border-box; box-shadow:0 0 10px rgba(0,0,0,0.1); 
            outline:none; /* Editable area */
        }
    </style>
</head>
<body>

<div class="ribbon">
    <button onclick="document.execCommand('bold')">B</button>
    <button onclick="document.execCommand('italic')">I</button>
    <button onclick="document.execCommand('underline')">U</button>
    <button onclick="document.execCommand('justifyLeft')">Left</button>
    <button onclick="document.execCommand('justifyCenter')">Center</button>
    <button onclick="document.execCommand('justifyFull')">Justify</button>
    <button onclick="exportPDF()" style="background:#0f172a; color:#fff;">Export PDF</button>
</div>

<div class="workspace" id="workspace">
    <div class="page" id="main-editor" contenteditable="true">
        <h1>Welcome</h1>
        <p>You can edit this page directly. Paste your text here, and format it using the ribbon above.</p>
    </div>
</div>

<script>
    const editor = document.getElementById('main-editor');

    // Auto-save function
    editor.addEventListener('input', () => {
        localStorage.setItem('doc-data', editor.innerHTML);
    });

    // Load data
    window.onload = () => {
        editor.innerHTML = localStorage.getItem('doc-data') || editor.innerHTML;
    };

    // Professional PDF Generation
    async function exportPDF() {
        const { jsPDF } = window.jspdf;
        const page = document.getElementById('main-editor');
        const canvas = await html2canvas(page, { scale: 2 });
        const img = canvas.toDataURL('image/jpeg', 1.0);
        const pdf = new jsPDF('p', 'pt', 'a4');
        pdf.addImage(img, 'JPEG', 0, 0, 595, 842);
        pdf.save("document.pdf");
    }
</script>
</body>
</html>
