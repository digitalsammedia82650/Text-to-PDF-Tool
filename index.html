<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Professional Document Architect</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
    :root { --bg: #e2e8f0; --page: #ffffff; --border: #cbd5e1; --primary: #2563eb; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); font-family: "Times New Roman", serif; display: flex; flex-direction: column; align-items: center; }

    .ribbon {
        position: sticky; top: 0; z-index: 1000; width: 100%; background: #fff;
        border-bottom: 1px solid var(--border); padding: 10px; display: flex;
        flex-wrap: wrap; justify-content: center; gap: 6px; box-shadow: 0 2px 6px rgba(0,0,0,.08);
    }
    .ribbon button, .ribbon select, .ribbon input {
        padding: 8px 10px; border: 1px solid var(--border); background: #f8fafc;
        border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600;
    }
    .export-btn { background: var(--primary)!important; color: #fff; }

    #workspace { display: flex; flex-direction: column; gap: 40px; padding: 40px; }
    .page {
        width: 794px; min-height: 1123px; background: #fff; padding: 96px;
        outline: none; border: 1px solid #e5e7eb; box-shadow: 0 0 15px rgba(0,0,0,.08);
        overflow-wrap: break-word;
    }

    table { width: 100%; border-collapse: collapse; margin: 15px 0; }
    th, td { border: 1px solid #333; padding: 8px; min-width: 50px; }
    
    /* High-Fidelity Image Container */
    .resizable-container {
        display: inline-block;
        resize: both;
        overflow: auto;
        border: 1px dashed #999;
        cursor: nwse-resize;
        margin: 5px;
    }
    .resizable-container img {
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none; /* Allows click-through to container */
    }
</style>
</head>
<body>

<div class="ribbon">
    <button onclick="document.execCommand('undo')">Undo</button>
    <button onclick="document.execCommand('redo')">Redo</button>
    <select onchange="document.execCommand('fontName',false,this.value)">
        <option value="Times New Roman">Times</option><option value="Arial">Arial</option>
        <option value="Calibri">Calibri</option><option value="Courier New">Courier</option>
    </select>
    <select onchange="document.execCommand('fontSize',false,this.value)">
        <option value="2">10pt</option><option value="3" selected>12pt</option>
        <option value="4">14pt</option><option value="5">16pt</option>
    </select>
    <input type="color" oninput="document.execCommand('foreColor',false,this.value)">
    <button onclick="document.execCommand('bold')">B</button>
    <button onclick="document.execCommand('italic')">I</button>
    <button onclick="document.execCommand('underline')">U</button>
    <button onclick="document.execCommand('justifyLeft')">Left</button>
    <button onclick="document.execCommand('justifyCenter')">Center</button>
    <button onclick="document.execCommand('justifyRight')">Right</button>
    <button onclick="document.execCommand('justifyFull')">Justify</button>
    <button onclick="document.execCommand('insertHorizontalRule')">Divider</button>
    <button onclick="insertTable()">Table</button>
    <button onclick="addRow()">+ Row</button>
    <button onclick="addColumn()">+ Col</button>
    <input type="file" id="imgUpload" style="display:none" onchange="uploadImage(event)">
    <button onclick="document.getElementById('imgUpload').click()">Image</button>
    <button onclick="addPage()">+ Page</button>
    <button onclick="clearDocument()">New Doc</button>
    <button class="export-btn" onclick="exportAllToPDF()">Export PDF</button>
</div>

<div id="workspace">
    <div class="page" contenteditable="true" oninput="saveDoc()"></div>
</div>

<script>
    function saveDoc(){ localStorage.setItem("doc-arch", document.getElementById("workspace").innerHTML); }
    window.onload = () => { const saved = localStorage.getItem("doc-arch"); if(saved) document.getElementById("workspace").innerHTML = saved; };
    function clearDocument(){ if(confirm("New document?")){ localStorage.removeItem("doc-arch"); location.reload(); } }
    function addPage(){ const p = document.createElement("div"); p.className = "page"; p.contentEditable = "true"; p.setAttribute("oninput", "saveDoc()"); document.getElementById("workspace").appendChild(p); saveDoc(); }

    /* Improved Image Handling */
    function uploadImage(e){
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            const container = document.createElement('div');
            container.className = 'resizable-container';
            container.style.width = '200px'; // Default size
            container.innerHTML = `<img src="${event.target.result}">`;
            document.execCommand("insertHTML", false, container.outerHTML);
            saveDoc();
        };
        reader.readAsDataURL(file);
    }

    /* Table Logic Preserved */
    function insertTable(){ document.execCommand("insertHTML", false, '<table><tr><td></td><td></td></tr><tr><td></td><td></td></tr></table>'); saveDoc(); }
    function getSelectedTable() { const sel = window.getSelection(); if(!sel.rangeCount) return null; let node = sel.anchorNode; while(node && node.tagName !== "TABLE") node = node.parentElement; return node; }
    function addRow(){ const t = getSelectedTable(); if(t) { t.insertRow().insertCell(); saveDoc(); } }
    function addColumn(){ const t = getSelectedTable(); if(t) { for(let r of t.rows) r.insertCell(); saveDoc(); } }

    async function exportAllToPDF(){
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF("p", "pt", "a4");
        const pages = document.querySelectorAll(".page");
        for(let i=0; i<pages.length; i++){
            if(i > 0) pdf.addPage();
            const canvas = await html2canvas(pages[i], {scale: 2, useCORS: true});
            pdf.addImage(canvas.toDataURL("image/jpeg"), "JPEG", 0, 0, 595, 842);
        }
        pdf.save("document.pdf");
    }
</script>
</body>
</html>
