<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pro Architect Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --bg:#f1f5f9; --page-shadow:0 0 10px rgba(0,0,0,0.1); }
        body { margin:0; background:var(--bg); font-family:Arial,sans-serif; height:100vh; display:flex; flex-direction:column; }
        
        /* Toolbar */
        .ribbon { background:white; padding:10px; border-bottom:1px solid #ccc; display:flex; gap:5px; flex-wrap:wrap; position:sticky; top:0; z-index:1000; }
        .group { border-right:1px solid #ddd; padding-right:5px; display:flex; gap:2px; }
        
        /* Canvas */
        .workspace { flex:1; overflow-y:auto; padding:40px; display:flex; flex-direction:column; align-items:center; gap:40px; }
        .page { width:794px; min-height:1123px; background:white; box-shadow:var(--page-shadow); padding:96px; box-sizing:border-box; position:relative; }
        .editor { width:100%; height:100%; outline:none; }
        
        /* Helpers */
        .doc-footer { position:absolute; bottom:20px; width:100%; text-align:center; font-size:12px; color:#888; }
        .dark-mode { background:#333; color:#eee; }
        .dark-mode .page { background:#444; color:#eee; }
    </style>
</head>
<body>

<div class="ribbon">
    <div class="group">
        <button onclick="fmt('bold')"><b>B</b></button>
        <button onclick="fmt('italic')"><i>I</i></button>
        <button onclick="fmt('underline')"><u>U</u></button>
        <button onclick="fmt('strikeThrough')"><s>S</s></button>
    </div>
    <div class="group">
        <button onclick="fmt('justifyLeft')">Left</button>
        <button onclick="fmt('justifyCenter')">Center</button>
        <button onclick="fmt('justifyFull')">Justify</button>
    </div>
    <div class="group">
        <select onchange="fmt('formatBlock', this.value)">
            <option value="p">Paragraph</option>
            <option value="h1">Heading 1</option>
            <option value="h2">Heading 2</option>
        </select>
        <button onclick="exportPDF()">Export PDF</button>
        <button onclick="toggleDark()">Dark</button>
    </div>
</div>

<div class="workspace" id="workspace">
    <div class="page" id="page">
        <div class="editor" id="editor" contenteditable="true">
            <h1>New Document</h1>
            <p>Start typing your professional content here...</p>
        </div>
        <div class="doc-footer" id="footer">Page 1</div>
    </div>
</div>

<script>
    const editor = document.getElementById('editor');

    // Rich Text Commands
    function fmt(cmd, val = null) {
        document.execCommand(cmd, false, val);
        editor.focus();
        save();
    }

    // Save System
    function save() {
        localStorage.setItem('pro-doc-content', editor.innerHTML);
    }

    // PDF Export
    async function exportPDF() {
        const { jsPDF } = window.jspdf;
        const page = document.getElementById('page');
        const canvas = await html2canvas(page, { scale: 2 });
        const img = canvas.toDataURL('image/jpeg', 1.0);
        const pdf = new jsPDF('p', 'pt', 'a4');
        pdf.addImage(img, 'JPEG', 0, 0, 595, 842);
        pdf.save('document.pdf');
    }

    function toggleDark() { document.body.classList.toggle('dark-mode'); }

    window.onload = () => {
        editor.innerHTML = localStorage.getItem('pro-doc-content') || '<h1>New Document</h1>';
        editor.addEventListener('input', save);
    };
</script>
</body>
</html>
