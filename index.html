<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ultimate Pro PDF Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root { --bg:#eef2ff; --primary:#7c3aed; --border:#dbe4f0; }
        body { margin:0; display:flex; height:100vh; font-family:sans-serif; background:var(--bg); }
        .sidebar { width:380px; background:white; border-right:1px solid var(--border); padding:20px; overflow-y:auto; }
        .workspace { flex:1; display:flex; justify-content:center; align-items:flex-start; padding:40px; overflow:auto; }
        #editor { min-height:200px; border:1px solid var(--border); padding:15px; border-radius:12px; outline:none; margin-bottom:15px; }
        .control-group { margin-bottom:15px; }
        label { display:block; font-size:11px; font-weight:900; text-transform:uppercase; color:#64748b; margin-bottom:5px; }
        .btn-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
        .btn { padding:10px; border:none; border-radius:8px; cursor:pointer; font-weight:700; background:var(--primary); color:white; }
        .full { width:100%; background:#0f172a; }
    </style>
</head>
<body>

<div class="sidebar">
    <h3>Project Editor</h3>
    <div id="editor" contenteditable="true" oninput="saveAndRender()"><h1>Title</h1><p>Enter text here...</p></div>
    
    <div class="control-group">
        <label>Background Color</label>
        <input type="color" id="bgColor" oninput="saveAndRender()">
    </div>
    
    <div class="btn-row">
        <button class="btn" onclick="undo()">Undo</button>
        <button class="btn" onclick="redo()">Redo</button>
    </div>
    <button class="btn full" onclick="generatePDF()">Download Final PDF</button>
    <button class="btn full" style="background:#ef4444; margin-top:10px;" onclick="clearStorage()">Reset Project</button>
</div>

<div class="workspace">
    <div class="canvas-shell" id="captureArea">
        <svg id="svgCanvas" width="595" height="842">
            <rect id="bgRect" width="100%" height="100%" fill="white" />
            <foreignObject id="fo" x="40" y="40" width="515" height="762">
                <div xmlns="http://www.w3.org/1999/xhtml" id="renderContent" style="padding:20px;"></div>
            </foreignObject>
        </svg>
    </div>
</div>

<script>
    // State Management
    let state = { history: [''], pointer: 0, bgColor: '#ffffff' };

    function saveAndRender() {
        const content = document.getElementById('editor').innerHTML;
        state.bgColor = document.getElementById('bgColor').value;
        state.history = state.history.slice(0, state.pointer + 1);
        state.history.push(content);
        state.pointer++;
        localStorage.setItem('pdfStudio_data', JSON.stringify(state));
        render();
    }

    function render() {
        document.getElementById('renderContent').innerHTML = document.getElementById('editor').innerHTML;
        document.getElementById('bgRect').setAttribute('fill', state.bgColor);
    }

    function undo() { if (state.pointer > 0) { state.pointer--; updateEditor(); } }
    function redo() { if (state.pointer < state.history.length - 1) { state.pointer++; updateEditor(); } }

    function updateEditor() {
        document.getElementById('editor').innerHTML = state.history[state.pointer];
        render();
    }

    function clearStorage() { localStorage.removeItem('pdfStudio_data'); location.reload(); }

    async function generatePDF() {
        const { jsPDF } = window.jspdf;
        const canvas = await html2canvas(document.getElementById('captureArea'), { scale: 3 });
        const pdf = new jsPDF('p', 'pt', 'a4');
        pdf.addImage(canvas.toDataURL('image/jpeg', 1.0), 'JPEG', 0, 0, 595, 842);
        pdf.save("final_document.pdf");
    }

    window.onload = () => {
        const saved = localStorage.getItem('pdfStudio_data');
        if (saved) {
            state = JSON.parse(saved);
            document.getElementById('editor').innerHTML = state.history[state.pointer];
            document.getElementById('bgColor').value = state.bgColor;
            render();
        }
    };
</script>

</body>
</html>
