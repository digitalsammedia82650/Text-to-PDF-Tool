<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pro PDF Studio | Advanced</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root { --bg:#f1f5f9; --primary:#4f46e5; --panel:white; }
        body { margin:0; display:flex; height:100vh; font-family: 'Segoe UI', sans-serif; background:var(--bg); }
        
        /* UI Panels */
        .toolbar { width:320px; background:var(--panel); border-right:1px solid #e2e8f0; display:flex; flex-direction:column; padding:20px; }
        .workspace { flex:1; overflow-y:auto; padding:40px; display:flex; flex-direction:column; align-items:center; gap:30px; }
        
        /* Editor & Controls */
        #editor { flex:1; border:1px solid #cbd5e1; border-radius:8px; padding:15px; outline:none; overflow-y:auto; background:#fff; }
        .controls { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:15px; }
        .btn { padding:10px; border:none; border-radius:6px; cursor:pointer; background:var(--primary); color:white; font-weight:600; }
        
        /* A4 Page */
        .page { width:595px; height:842px; background:white; position:relative; box-shadow:0 10px 15px -3px rgba(0,0,0,0.1); padding:60px; box-sizing:border-box; overflow:hidden; }
        .page-num { position:absolute; bottom:20px; right:40px; font-size:12px; color:#64748b; }
    </style>
</head>
<body>

<div class="toolbar">
    <h3 style="margin-top:0">PDF Studio Pro</h3>
    <div id="editor" contenteditable="true" oninput="saveAndRender()"></div>
    
    <div class="controls">
        <button class="btn" onclick="undo()">Undo</button>
        <button class="btn" onclick="redo()">Redo</button>
        <button class="btn" style="grid-column: span 2; background:#0f172a;" onclick="exportPDF()">Export Final PDF</button>
    </div>
</div>

<div class="workspace" id="workspace"></div>

<script>
    let history = [''], pointer = 0;

    function saveAndRender() {
        const text = document.getElementById('editor').innerHTML;
        history = history.slice(0, pointer + 1);
        history.push(text);
        pointer++;
        localStorage.setItem('doc', text);
        render();
    }

    function undo() { if(pointer > 0) { pointer--; applyState(); } }
    function redo() { if(pointer < history.length - 1) { pointer++; applyState(); } }

    function applyState() {
        document.getElementById('editor').innerHTML = history[pointer];
        render();
    }

    function render() {
        const content = document.getElementById('editor').innerHTML;
        const workspace = document.getElementById('workspace');
        workspace.innerHTML = '';

        // Pagination Logic: Break content into A4 chunks
        const temp = document.createElement('div');
        temp.style.width = '475px'; // Page width - padding
        temp.style.position = 'absolute';
        temp.style.visibility = 'hidden';
        temp.innerHTML = content;
        document.body.appendChild(temp);

        const pageHeight = 722; // Page height - padding
        const totalPages = Math.max(1, Math.ceil(temp.offsetHeight / pageHeight));

        for (let i = 0; i < totalPages; i++) {
            const page = document.createElement('div');
            page.className = 'page';
            page.innerHTML = `
                <div style="height:${pageHeight}px; overflow:hidden;">
                    ${content}
                </div>
                <div class="page-num">Page ${i + 1} of ${totalPages}</div>
            `;
            // Shift content for multi-page
            page.querySelector('div').style.marginTop = `-${i * pageHeight}px`;
            workspace.appendChild(page);
        }
        document.body.removeChild(temp);
    }

    async function exportPDF() {
        const { jsPDF } = window.jspdf;
        const pages = document.querySelectorAll('.page');
        const pdf = new jsPDF('p', 'pt', 'a4');
        for (let i = 0; i < pages.length; i++) {
            if (i > 0) pdf.addPage();
            const canvas = await html2canvas(pages[i], { scale: 2 });
            pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 595, 842);
        }
        pdf.save("document.pdf");
    }

    window.onload = () => {
        const saved = localStorage.getItem('doc');
        if(saved) {
            document.getElementById('editor').innerHTML = saved;
            history = [saved];
        }
        render();
    };
</script>
</body>
</html>
