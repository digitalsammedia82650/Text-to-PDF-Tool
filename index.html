<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pro Document Architect</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root { --bg:#e2e8f0; --panel:white; --primary:#4f46e5; }
        body { margin:0; display:flex; height:100vh; background:var(--bg); font-family:sans-serif; }
        
        .sidebar { width:350px; background:var(--panel); border-right:1px solid #cbd5e1; padding:20px; overflow-y:auto; }
        .workspace { flex:1; overflow-y:auto; padding:40px; display:flex; flex-direction:column; align-items:center; gap:30px; }
        
        #editor { min-height:300px; border:1px solid #cbd5e1; padding:15px; outline:none; border-radius:6px; }
        .page { background:white; position:relative; box-shadow:0 10px 20px rgba(0,0,0,0.1); padding:60px; box-sizing:border-box; overflow:hidden; }
        .page-num { position:absolute; bottom:20px; right:40px; font-size:12px; }
        .btn { width:100%; padding:10px; margin-top:10px; cursor:pointer; background:var(--primary); color:white; border:none; font-weight:700; border-radius:4px; }
    </style>
</head>
<body>

<div class="sidebar">
    <h3>Document Settings</h3>
    <label>Page Size</label>
    <select id="pageSize" onchange="updatePageSize()" style="width:100%; padding:8px; margin-bottom:15px;">
        <option value="A4">A4 (595x842)</option>
        <option value="A3">A3 (842x1191)</option>
        <option value="B5">B5 (499x709)</option>
    </select>

    <div id="editor" contenteditable="true" oninput="saveAndRender()"></div>
    
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <button class="btn" onclick="undo()">Undo</button>
        <button class="btn" onclick="redo()">Redo</button>
    </div>
    <button class="btn" style="background:#0f172a;" onclick="exportPDF()">Export Final PDF</button>
</div>

<div class="workspace" id="workspace"></div>

<script>
    // Document Configurations
    const sizes = { A4: [595, 842], A3: [842, 1191], B5: [499, 709] };
    let history = [''], pointer = 0;

    function updatePageSize() { render(); }

    function saveAndRender() {
        const text = document.getElementById('editor').innerHTML;
        history = history.slice(0, pointer + 1);
        history.push(text);
        pointer++;
        render();
    }

    function render() {
        const content = document.getElementById('editor').innerHTML;
        const workspace = document.getElementById('workspace');
        const [w, h] = sizes[document.getElementById('pageSize').value];
        workspace.innerHTML = '';

        // Create Mirror for Pagination
        const temp = document.createElement('div');
        temp.style.width = (w - 120) + 'px';
        temp.style.position = 'absolute'; temp.style.visibility = 'hidden';
        temp.innerHTML = content;
        document.body.appendChild(temp);

        const pageContentHeight = h - 140;
        const totalPages = Math.max(1, Math.ceil(temp.offsetHeight / pageContentHeight));

        for (let i = 0; i < totalPages; i++) {
            const page = document.createElement('div');
            page.className = 'page';
            page.style.width = w + 'px'; page.style.height = h + 'px';
            page.innerHTML = `
                <div style="height:${pageContentHeight}px; overflow:hidden;">
                    <div style="margin-top:-${i * pageContentHeight}px">${content}</div>
                </div>
                <div class="page-num">Page ${i + 1} of ${totalPages}</div>
            `;
            workspace.appendChild(page);
        }
        document.body.removeChild(temp);
    }

    async function exportPDF() {
        const { jsPDF } = window.jspdf;
        const [w, h] = sizes[document.getElementById('pageSize').value];
        const pages = document.querySelectorAll('.page');
        const pdf = new jsPDF('p', 'pt', [w, h]);
        for (let i = 0; i < pages.length; i++) {
            if (i > 0) pdf.addPage();
            const canvas = await html2canvas(pages[i], { scale: 2 });
            pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, w, h);
        }
        pdf.save("document.pdf");
    }

    function undo() { if(pointer > 0) { pointer--; document.getElementById('editor').innerHTML = history[pointer]; render(); } }
    function redo() { if(pointer < history.length - 1) { pointer++; document.getElementById('editor').innerHTML = history[pointer]; render(); } }
    window.onload = render;
</script>
</body>
</html>
