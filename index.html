<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Docs Style Editor + PDF Export</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;height:100vh;display:flex;flex-direction:column}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;padding:10px;background:#fff;border-bottom:1px solid #ddd}
button,select{padding:8px}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:320px;background:#fff;padding:12px;border-right:1px solid #ddd;overflow:auto}
.workspace{flex:1;overflow:auto;padding:20px;display:flex;justify-content:center}
.page{width:794px;min-height:1123px;background:#fff;padding:50px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
#editor{min-height:1000px;outline:none}
.dark{background:#111;color:#eee}
.dark .toolbar,.dark .sidebar,.dark .page{background:#222;color:#eee}
</style>
</head>
<body>
<div class="toolbar">
<button onclick="fmt('bold')">Bold</button>
<button onclick="fmt('italic')">Italic</button>
<button onclick="fmt('underline')">Underline</button>
<button onclick="fmt('insertUnorderedList')">List</button>
<button onclick="fmt('justifyCenter')">Center</button>
<select id="heading" onchange="setHeading(this.value)">
<option value="">Paragraph</option>
<option value="H1">H1</option>
<option value="H2">H2</option>
<option value="H3">H3</option>
</select>
<button onclick="toggleDark()">Dark Mode</button>
<button onclick="exportTextPDF()">Text PDF</button>
<button onclick="exportVisualPDF()">WYSIWYG PDF</button>
</div>

<div class="main">
<div class="sidebar">
<h3>Document Stats</h3>
<div id="stats"></div>
<hr>
<button onclick="loadTemplate('resume')">Resume Template</button>
<button onclick="loadTemplate('letter')">Letter Template</button>
<button onclick="loadTemplate('report')">Report Template</button>
</div>

<div class="workspace">
<div class="page" id="page">
<div id="editor" contenteditable="true"></div>
</div>
</div>
</div>

<script>
const editor=document.getElementById('editor');

function fmt(cmd){document.execCommand(cmd,false,null);save();}
function setHeading(v){if(v) document.execCommand('formatBlock',false,v); save();}

function save(){
 localStorage.setItem('docs-content',editor.innerHTML);
 updateStats();
}

function updateStats(){
 let text=editor.innerText||'';
 let words=text.trim()?text.trim().split(/\s+/).length:0;
 document.getElementById('stats').innerHTML=
 'Words: '+words+'<br>Characters: '+text.length;
}

function toggleDark(){
 document.body.classList.toggle('dark');
}

function loadTemplate(t){
 if(t==='resume'){
 editor.innerHTML='<h1>Your Name</h1><h2>Experience</h2><p>Add experience...</p>';
 }
 if(t==='letter'){
 editor.innerHTML='<h1>Letter</h1><p>Dear Sir/Madam,</p><p>...</p>';
 }
 if(t==='report'){
 editor.innerHTML='<h1>Report Title</h1><h2>Introduction</h2><p>...</p>';
 }
 save();
}

editor.addEventListener('input',save);

window.onload=()=>{
 editor.innerHTML=localStorage.getItem('docs-content')||'<h1>New Document</h1>';
 updateStats();
};

async function exportVisualPDF(){
 const {jsPDF}=window.jspdf;
 const canvas=await html2canvas(document.getElementById('page'),{scale:2});
 const img=canvas.toDataURL('image/png');
 const pdf=new jsPDF('p','pt','a4');
 const w=595.28;
 const h=canvas.height*w/canvas.width;
 pdf.addImage(img,'PNG',0,0,w,h);
 pdf.save('wysiwyg-document.pdf');
}

function exportTextPDF(){
 const {jsPDF}=window.jspdf;
 const pdf=new jsPDF();
 const text=editor.innerText || '';
 const lines=pdf.splitTextToSize(text,180);
 pdf.text(lines,10,10);
 pdf.save('text-document.pdf');
}
</script>
</body>
</html>
