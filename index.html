<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pro Doc Platform</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { margin:0; background:#e2e8f0; font-family:Arial,sans-serif; }
        .ribbon { background:#fff; padding:10px; border-bottom:1px solid #ccc; display:flex; gap:5px; position:sticky; top:0; z-index:1000; }
        .workspace { padding:40px; display:flex; flex-direction:column; align-items:center; gap:40px; }
        
        /* Professional A4 Page Canvas */
        .page { 
            width:794px; min-height:1123px; background:white; 
            padding:96px; box-sizing:border-box; 
            box-shadow:0 0 10px rgba(0,0,0,0.1); 
            position:relative; overflow:hidden; 
        }
        
        /* Editor Area */
        #editor { outline:none; min-height:931px; }
    </style>
</head>
<body>

<div class="ribbon">
    <button onclick="document.execCommand('bold', false)"><b>B</b></button>
    <button onclick="document.execCommand('italic', false)"><i>I</i></button>
    <button onclick="document.execCommand('underline', false)"><u>U</u></button>
    <button onclick="document.execCommand('justifyFull', false)">Justify</button>
    <button onclick="document.execCommand('insertUnorderedList', false)">List</button>
    <button onclick="generatePages()">Re-Flow Pages</button>
    <button onclick="exportPDF()">Export PDF</button>
</div>

<div class="workspace" id="workspace">
    <div class="page" id="page1">
        <div id="editor" contenteditable="true" oninput="generatePages()">
            <h1>Paste your document here...</h1>
        </div>
    </div>
</div>

<script>
    const editor = document.getElementById('editor');
    const workspace = document.getElementById('workspace');

    function generatePages() {
        const content = editor.innerHTML;
        const pageHeight = 1123 - 192; // Height minus padding

        // Measure actual content height
        const temp = document.createElement('div');
        temp.style.width = '602px'; // 794 minus padding
        temp.style.position = 'absolute'; temp.style.visibility = 'hidden';
        temp.innerHTML = content;
        document.body.appendChild(temp);

        const totalPages = Math.max(1, Math.ceil(temp.offsetHeight / pageHeight));
        workspace.innerHTML = ''; // Clear current pages

        for (let i = 0; i < totalPages; i++) {
            const page = document.createElement('div');
            page.className = 'page';
            page.innerHTML = `
                <div style="height:${pageHeight}px; overflow:hidden;">
                    <div style="margin-top:-${i * pageHeight}px">${content}</div>
                </div>
                <div style="position:absolute; bottom:20px; text-align:center; width:100%;">Page ${i + 1}</div>
            `;
            workspace.appendChild(page);
        }
        document.body.removeChild(temp);
    }

    async function exportPDF() {
        const { jsPDF } = window.jspdf;
        const pages = document.querySelectorAll('.page');
        const pdf = new jsPDF('p', 'pt', 'a4');
        for (let i = 0; i < pages.length; i++) {
            if (i > 0) pdf.addPage();
            const canvas = await html2canvas(pages[i], { scale: 2 });
            pdf.addImage(canvas.toDataURL('image/jpeg', 1.0), 'JPEG', 0, 0, 595, 842);
        }
        pdf.save("document.pdf");
    }
</script>
</body>
</html>
