<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Multi-Page PDF Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body { margin:0; background:#e2e8f0; font-family:sans-serif; }
        .toolbar { position:fixed; top:0; left:0; width:300px; height:100vh; background:white; padding:20px; border-right:1px solid #ccc; z-index:100; }
        .workspace { margin-left:340px; padding:40px; display:flex; flex-direction:column; align-items:center; gap:20px; }
        
        /* A4 Page Styling */
        .page { 
            width: 595px; height: 842px; background: white; 
            padding: 50px; box-sizing: border-box; position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .page-content { height: 700px; overflow: hidden; }
        .page-number { position: absolute; bottom: 20px; right: 20px; font-size: 12px; }
        
        #editor { width: 100%; height: 200px; border: 1px solid #ddd; padding: 10px; margin-bottom: 20px; outline: none; }
        .btn { width: 100%; padding: 10px; background: #4f46e5; color: white; border: none; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="toolbar">
    <h3>Document Manager</h3>
    <div id="editor" contenteditable="true" oninput="paginate()"></div>
    
    <label>Page Border (px)</label>
    <input type="number" id="bWidth" value="1" oninput="paginate()">
    
    <button class="btn" onclick="downloadPDF()">Download PDF</button>
</div>

<div class="workspace" id="workspace">
    </div>

<script>
    function paginate() {
        const editor = document.getElementById('editor');
        const workspace = document.getElementById('workspace');
        const bWidth = document.getElementById('bWidth').value;
        
        // 1. Clear Workspace
        workspace.innerHTML = '';
        
        // 2. Logic: Create a hidden mirror to calculate overflow
        const content = editor.innerHTML;
        const temp = document.createElement('div');
        temp.style.width = "495px"; // A4 Width - Padding
        temp.style.visibility = "hidden";
        temp.innerHTML = content;
        document.body.appendChild(temp);
        
        // 3. Simple Pagination Loop
        let pages = Math.max(1, Math.ceil(temp.offsetHeight / 700));
        
        for(let i=0; i<pages; i++) {
            const page = document.createElement('div');
            page.className = 'page';
            page.style.border = `${bWidth}px solid black`;
            page.innerHTML = `
                <div class="page-content">${content}</div>
                <div class="page-number">Page ${i + 1} of ${pages}</div>
            `;
            workspace.appendChild(page);
        }
        
        document.body.removeChild(temp);
        localStorage.setItem('doc_state', JSON.stringify({text: content, bWidth}));
    }

    async function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const pages = document.querySelectorAll('.page');
        const pdf = new jsPDF('p', 'pt', 'a4');

        for (let i = 0; i < pages.length; i++) {
            if (i > 0) pdf.addPage();
            const canvas = await html2canvas(pages[i], { scale: 2 });
            pdf.addImage(canvas.toDataURL('image/jpeg'), 'JPEG', 0, 0, 595, 842);
        }
        pdf.save("document.pdf");
    }

    window.onload = () => {
        const saved = JSON.parse(localStorage.getItem('doc_state'));
        if(saved) {
            document.getElementById('editor').innerHTML = saved.text;
            document.getElementById('bWidth').value = saved.bWidth;
            paginate();
        }
    };
</script>
</body>
</html>
