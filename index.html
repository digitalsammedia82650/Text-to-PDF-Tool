<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pro Document Architect</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --bg: #e2e8f0; --page: #ffffff; --border: #cbd5e1; }
        body { margin: 0; background: var(--bg); font-family: 'Arial', sans-serif; display: flex; flex-direction: column; align-items: center; }
        
        .ribbon { position: sticky; top: 0; z-index: 1000; width: 100%; background: #fff; padding: 10px; border-bottom: 1px solid var(--border); display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
        #workspace { display: flex; flex-direction: column; gap: 40px; padding: 40px; }
        .page { width: 794px; min-height: 1123px; background: var(--page); padding: 96px; box-sizing: border-box; box-shadow: 0 0 15px rgba(0,0,0,0.1); outline: none; position: relative; }
        
        /* Table Styles */
        table { border-collapse: collapse; width: 100%; margin: 10px 0; }
        th, td { border: 1px solid #333; padding: 8px; min-width: 50px; }
    </style>
</head>
<body>

<div class="ribbon">
    <button onclick="document.execCommand('undo')">↩</button>
    <button onclick="document.execCommand('redo')">↪</button>
    <select onchange="document.execCommand('fontName', false, this.value)">
        <option value="Arial">Arial</option><option value="Times New Roman">Times</option><option value="Courier New">Courier</option>
    </select>
    <select onchange="document.execCommand('fontSize', false, this.value)">
        <option value="3">12pt</option><option value="4">14pt</option><option value="6">18pt</option>
    </select>
    <button onclick="insertTable()">Add Table</button>
    <button onclick="addRow()">+Row</button>
    <button onclick="addColumn()">+Col</button>
    <button onclick="addPage()">+Page</button>
    <button onclick="exportAllToPDF()" style="background:#2563eb; color:white;">Export PDF</button>
</div>

<div id="workspace">
    <div class="page" contenteditable="true" oninput="saveDoc()"></div>
</div>

<script>
    // Persistence Engine
    function saveDoc() {
        localStorage.setItem('doc-data', document.getElementById('workspace').innerHTML);
    }
    window.onload = () => {
        const saved = localStorage.getItem('doc-data');
        if (saved) document.getElementById('workspace').innerHTML = saved;
    };

    // Advanced Table Logic
    function insertTable() {
        const table = `<table><tr><td></td><td></td></tr><tr><td></td><td></td></tr></table>`;
        document.execCommand('insertHTML', false, table);
    }
    function addRow() {
        const selection = window.getSelection().anchorNode.parentElement.closest('table');
        if(selection) selection.insertRow();
    }
    function addColumn() {
        const table = window.getSelection().anchorNode.parentElement.closest('table');
        if(table) for(let row of table.rows) row.insertCell();
    }

    // Page Management
    function addPage() {
        const div = document.createElement('div');
        div.className = 'page';
        div.contentEditable = 'true';
        div.oninput = saveDoc;
        document.getElementById('workspace').appendChild(div);
    }

    // PDF Export
    async function exportAllToPDF() {
        const { jsPDF } = window.jspdf;
        const pages = document.querySelectorAll('.page');
        const pdf = new jsPDF('p', 'pt', 'a4');
        for (let i = 0; i < pages.length; i++) {
            if (i > 0) pdf.addPage();
            const canvas = await html2canvas(pages[i], { scale: 2 });
            pdf.addImage(canvas.toDataURL('image/jpeg', 1.0), 'JPEG', 0, 0, 595, 842);
        }
        pdf.save("document.pdf");
    }
</script>
</body>
</html>
