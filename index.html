<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Architect Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --bg:#eef2ff; --panel:#ffffff; --border:#dbe4f0; --primary:#7c3aed; }
        body { margin:0; font-family:Inter,sans-serif; background:var(--bg); height:100vh; display:flex; flex-direction:column; }
        
        /* Layout */
        header { height:74px; background:white; border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 20px; justify-content:space-between; }
        .main { flex:1; display:flex; overflow:hidden; }
        .sidebar { width:400px; background:white; border-right:1px solid var(--border); overflow-y:auto; padding:20px; }
        .workspace { flex:1; overflow-y:auto; padding:40px; display:flex; flex-direction:column; align-items:center; gap:40px; }
        
        /* Document Styles */
        .page { width:794px; min-height:1123px; background:white; padding:70px 60px; box-shadow:0 10px 25px rgba(0,0,0,0.1); position:relative; box-sizing:border-box; }
        .doc-header { position:absolute; top:20px; left:60px; right:60px; border-bottom:1px solid #ddd; font-size:12px; color:#666; }
        .doc-footer { position:absolute; bottom:20px; left:60px; right:60px; border-top:1px solid #ddd; text-align:center; font-size:12px; color:#666; }
        
        #editor { min-height:500px; outline:none; border:1px solid var(--border); padding:15px; border-radius:12px; }
    </style>
</head>
<body>

<header>
    <div class="logo">Document <span>Architect</span></div>
    <button class="btn" onclick="exportPDF()" style="background:var(--primary); color:white; border:none; padding:10px 20px; border-radius:8px;">Download PDF</button>
</header>

<div class="main">
    <aside class="sidebar">
        <div id="editor" contenteditable="true" oninput="paginate()">
            <h1>Document Title</h1>
            <p>Type your content here. Pagination generates automatically.</p>
        </div>
    </aside>

    <div class="workspace" id="workspace"></div>
</div>

<script>
    // Pagination Engine
    function paginate() {
        const editor = document.getElementById('editor');
        const workspace = document.getElementById('workspace');
        const content = editor.innerHTML;
        workspace.innerHTML = '';

        // Create mirror for height calculation
        const temp = document.createElement('div');
        temp.style.width = '674px'; temp.style.position = 'absolute'; temp.style.visibility = 'hidden';
        temp.innerHTML = content;
        document.body.appendChild(temp);

        const pageHeight = 963; // A4 height minus margins
        const totalPages = Math.max(1, Math.ceil(temp.offsetHeight / pageHeight));

        for (let i = 0; i < totalPages; i++) {
            const page = document.createElement('div');
            page.className = 'page';
            page.innerHTML = `
                <div class="doc-header">Professional Document</div>
                <div style="height:${pageHeight}px; overflow:hidden;">
                    <div style="margin-top:-${i * pageHeight}px">${content}</div>
                </div>
                <div class="doc-footer">Page ${i + 1} of ${totalPages}</div>
            `;
            workspace.appendChild(page);
        }
        document.body.removeChild(temp);
        localStorage.setItem('doc-state', content);
    }

    async function exportPDF() {
        const { jsPDF } = window.jspdf;
        const pages = document.querySelectorAll('.page');
        const pdf = new jsPDF('p', 'pt', [794, 1123]);
        for (let i = 0; i < pages.length; i++) {
            if (i > 0) pdf.addPage();
            const canvas = await html2canvas(pages[i], { scale: 2 });
            pdf.addImage(canvas.toDataURL('image/jpeg', 1.0), 'JPEG', 0, 0, 794, 1123);
        }
        pdf.save("document.pdf");
    }

    window.onload = () => {
        document.getElementById('editor').innerHTML = localStorage.getItem('doc-state') || '<h1>New Document</h1>';
        paginate();
    };
</script>
</body>
</html>
